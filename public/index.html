<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todos</title>
    <script>
      // Apply a saved Light or Dark before the first paint; public/theme.js does the rest.
      try {
        const theme = localStorage.getItem('todo-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {
        // No storage: follow the computer's setting.
      }
    </script>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>Todos</h1>
        <div id="theme-switch" class="theme-switch" role="group" aria-label="Theme">
          <button type="button" data-theme-choice="system" aria-pressed="true">System</button>
          <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
        </div>
      </header>

      <form id="new-todo" autocomplete="off">
        <input id="title" name="title" placeholder="What needs doing?" required maxlength="200" aria-label="Title">
        <input id="tags" name="tags" placeholder="Tags, separated by commas" aria-label="Tags">
        <button type="submit">Add</button>
      </form>
      <p id="error" class="error" role="alert" hidden></p>

      <div class="layout">
        <section aria-label="Todos">
          <div class="toolbar">
            <input id="search" type="search" placeholder="Search" aria-label="Search todos">
            <a id="download" class="button" href="/api/todos.csv" download>Download CSV</a>
          </div>
          <ul id="todos" class="todos"></ul>
          <p id="empty" class="muted" hidden>Nothing here yet.</p>
          <nav class="pager" aria-label="Pages">
            <button id="previous" type="button">Previous</button>
            <span id="page-info" class="muted"></span>
            <button id="next" type="button">Next</button>
          </nav>
        </section>

        <aside aria-labelledby="tags-heading">
          <h2 id="tags-heading">Tags</h2>
          <ul id="tag-counts" class="tag-counts"></ul>
          <p id="no-tags" class="muted" hidden>No tags yet.</p>
        </aside>
      </div>
    </main>
  </body>
</html>
